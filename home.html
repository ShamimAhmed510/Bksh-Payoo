<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>payoo Hoome</title>
    <link rel="shortcut icon" href="assets/Logo-full.png" type="image/x-icon" />

    <!-- Tailwind + daisyui -->

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- icons -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>

  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="border-b-2 py-3 border-gray-300">
      <section class="w-11/12 mx-auto flex justify-between items-center">
        <div class="left flex gap-1">
          <div class="logo w-[60px]">
            <img src="assets/logo.png" alt="" />
          </div>
          <div class="balance-info">
            <h2 class="text-2xl font-bold">
              $ <span id="balance">4500.00</span>
            </h2>
            <p class="text-neutral/50">Available Balance</p>
          </div>
        </div>
        <div class="right">
          <a href="index.html" class="btn btn-soft">
            <i class="fa-solid fa-right-to-bracket"></i>Logout
          </a>
        </div>
      </section>

      <section class="w-11/12 mx-auto py-10 space-y-5">
        <h2 class="text 2xl font-bold">
          Welcome to Pay <span class="text primary">oo</span>
          <p class="text-neutral/50">
            Enjoy easy and convinent financial service wit us Cashout charge in
            law.
          </p>
        </h2>
      </section>

      <section>
        <div class="buttons grid grid-cols-3 gap-3">
          <button
          id="cashout-Btn"
            onclick="showonly('add-money')"
            class="btn flex-col h-full py-4 btn-primary btn-soft"
          >
            <img src="assets/opt-1.png" alt="" />
            <p>Add Money</p>
          </button>

          <button
            onclick="showonly('cashout')"
            class="btn flex-col h-full py-4 btn-primary btn-soft"
          >
            <img src="assets/opt-2.png" alt="" />
            <p>Send Money</p>
          </button>

          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-3.png" alt="" />
            <p>Cash Out</p>
          </button>

          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-4.png" alt="" />
            <p>Get Bonus</p>
          </button>

          <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-5.png" alt="" />
            <p>Pay bill</p>
          </button>

          <button
            onclick="showonly('transaction')"
            id="transaction-Btn"
            class="btn flex-col h-full py-4 btn-primary btn-soft"
          >
            <img src="assets/opt-6.png" alt="" />
            <p>Transaction</p>
          </button>
        </div>
      </section>

      <section id="add-money" class="w-11/12 mx-auto py-5">
        <h2 class="text xl font-bold mb-5">Add Money</h2>

        <div class="" from pt-10>
          <div class="card bg-base-100 w-full shadow rounded-2xl">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label font-bold">Select Bank</label>
                <select id="add-money-bank" class="select select-ghost">
                  <option disabled selected>Select A Bank</option>
                  <option>DBBL</option>
                  <option>IBBL</option>
                  <option>City</option>
                </select>

                <label class="label font-bold">Bank Account Number</label>
                <input
                  id="add-money-number"
                  type="number"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter Your Bank Account Number"
                />
                <br />
                <label class="label font-bold">Amount to Add</label>
                <input
                  id="add-money-amount"
                  type="number"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter Amount"
                />
                <br />
                <label class="label font-bold">4 Digit Pin</label>
                <input
                  id="add-money-pin"
                  maxlength="4"
                  minlength="4"
                  type="text"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter 4-Digit Pin"
                />

                <button
                  id="add-money-Btn"
                  class="btn mt-4 btn-primary rounded-full"
                >
                  Add Money
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>

      <section id="cashout" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text xl font-bold mb-5">Cashout</h2>
        <div class="" from pt-10>
          <div class="card bg-base-100 w-full shadow rounded-2xl">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label font-bold">Agent Number</label>
                <input
                  id="cashout-number"
                  maxlength="11"
                  minlength="11"
                  type="text"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter Your Agent Number"
                />
                <br />
                <label class="label font-bold">Amount</label>
                <input
                  id="cashout-amount"
                  maxlength="11"
                  minlength="11"
                  type="number"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter Amount"
                />
                <br />
                <label class="label font-bold">4 Digit Pin</label>
                <input
                  id="cashout-pin"
                  maxlength="4"
                  minlength="4"
                  type="text"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter 4-Digit Pin"
                />

                <button
                  id="cashout-Btn"
                  class="btn mt-4 btn-primary rounded-full"
                >
                  WithDraw Money
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>

       <section id="transaction" class="w-11/12 mx-auto py-5">
        <h2 class="text xl font-bold mb-5">Add Money</h2>

        <div class="" from pt-10>
          <div class="card bg-base-100 w-full shadow rounded-2xl">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label font-bold">Select Bank</label>
                <select id="add-money-bank" class="select select-ghost">
                  <option disabled selected>Select A Bank</option>
                  <option>DBBL</option>
                  <option>IBBL</option>
                  <option>City</option>
                </select>

                <label class="label font-bold">Bank Account Number</label>
                <input
                  id="add-money-number"
                  type="number"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter Your Bank Account Number"
                />
                <br />
                <label class="label font-bold">Amount to Add</label>
                <input
                  id="add-money-amount"
                  type="number"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter Amount"
                />
                <br />
                <label class="label font-bold">4 Digit Pin</label>
                <input
                  id="add-money-pin"
                  maxlength="4"
                  minlength="4"
                  type="text"
                  class="input rounded-full bg-base-200 w-full"
                  placeholder="Enter 4-Digit Pin"
                />

                <button
                  id="transaction-Btn"
                  class="btn mt-4 btn-primary rounded-full"
                >
                  Add Money
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>

      <script src="script/cashout.js"></script>
      <script src="script/addmoney.js"></script>
      <script src="script/machine.js"></script>
      <script src="script/transaction.js"></script>
    </header>
  </body>
</html>
